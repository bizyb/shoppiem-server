#-------------------------------------------------
# Database  Settings
#-------------------------------------------------
host: localhost
port: 27017
db_name: sunbeamdb
sent_db: test_sentencedb
ingestion_db: test_rawfeeddb


#-------------------------------------------------
# Merchant-specific data field names
#-------------------------------------------------
merchants:
  Amazon: 
    sku: asin
    review_text: reviewText

#-------------------------------------------------
# Doc2Vec parameters/hyperparameters
#-------------------------------------------------
doc2vec:
  vector_size: 100
  epochs: 20
  min_count: 50
  dm: 0
  negative: 5
  alpha: 0.025
  min_alpha: 0.001
  path: ml/models
  inference:
    topn: 10
    steps: 100000